<style>
/* Layout: left rail lists the nine match arms; main pane is the exam skeleton with one live arm, then the test bench. */
:root {
  --bg: #eef1f6;
  --panel: #ffffff;
  --ink: #13294b;
  --muted: #5b6b84;
  --line: #d5dce7;
  --accent: #e84a27;
  --accent-soft: #fde7e0;
  --code: #f6f8fb;
  --kw: #b4361a;
  --ctor: #1d5fa8;
  --cmt: #7d8aa0;
  --str: #2f7d4a;
  --ok: #1f7a4d;
  --ok-soft: #e1f3e8;
  --bad: #b42318;
  --bad-soft: #fde4e1;
  --warn: #9a5b00;
  --warn-soft: #fbefd6;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1424; --panel: #111d33; --ink: #e5ebf5; --muted: #93a2ba; --line: #24365a;
    --accent: #ff6b47; --accent-soft: #3a1d17; --code: #0c1629;
    --kw: #ff9a7a; --ctor: #79bdfc; --cmt: #6c7d98; --str: #8fd9a3;
    --ok: #4bd08a; --ok-soft: #12301f; --bad: #ff7b6e; --bad-soft: #3a1714; --warn: #f5c04a; --warn-soft: #33270c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1424; --panel: #111d33; --ink: #e5ebf5; --muted: #93a2ba; --line: #24365a;
  --accent: #ff6b47; --accent-soft: #3a1d17; --code: #0c1629;
  --kw: #ff9a7a; --ctor: #79bdfc; --cmt: #6c7d98; --str: #8fd9a3;
  --ok: #4bd08a; --ok-soft: #12301f; --bad: #ff7b6e; --bad-soft: #3a1714; --warn: #f5c04a; --warn-soft: #33270c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
code, pre, textarea, .mono { font-family: var(--font-mono); font-size: 13px; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
  padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand b { font-family: var(--font-mono); font-size: 18px; letter-spacing: -0.01em; }
.brand b span { color: var(--accent); }
.brand small { color: var(--muted); font-size: 13px; }
.top .spacer { flex: 1; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress b { color: var(--ink); }

.wrap {
  display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; max-width: 1240px; margin: 0 auto;
  padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
nav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); align-self: start; }
nav .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 10px 10px 6px; }
nav button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: none; border: 1px solid transparent; border-radius: 6px; padding: 7px 10px; color: var(--ink); cursor: pointer;
}
nav button:hover { background: var(--panel); border-color: var(--line); }
nav button.on { background: var(--panel); border-color: var(--ink); }
nav button code { font-size: 12.5px; }
.dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; }
.dot.ok { background: var(--ok); border-color: var(--ok); }
.dot.bad { background: var(--bad); border-color: var(--bad); }
nav .exam code { font-weight: 700; }

main { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; min-width: 0; }
.head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; }
.head h1 { margin: 0; font-size: 20px; font-weight: 600; text-wrap: balance; }
.head h1 code { font-size: 19px; }
.pill { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; background: var(--code); color: var(--muted); border: 1px solid var(--line); }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.rule { margin: 14px 0 0; padding: 10px 14px; background: var(--accent-soft); border-radius: 6px; font-family: var(--font-mono); font-size: 13.5px; overflow-x: auto; white-space: pre; }
.rule .lbl { font-family: var(--font-body); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); display: block; margin-bottom: 2px; font-weight: 700; }
.scope { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; align-items: center; }
.scope .lbl { font-size: 12px; color: var(--muted); margin-right: 4px; }
.scope code { background: var(--code); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-size: 12px; }
.scope code i { font-style: normal; color: var(--muted); }

.editor { margin-top: 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--code); overflow: hidden; }
.editor pre { margin: 0; padding: 0 14px; white-space: pre; overflow-x: auto; line-height: 1.6; }
.editor pre.first { padding-top: 12px; }
.editor pre.last { padding-bottom: 12px; }
.editor .dim { opacity: 0.55; }
.slot { display: block; padding: 4px 14px 8px 14px; }
.slot textarea {
  display: block; width: 100%; resize: vertical; min-height: 4.8em; line-height: 1.6; padding: 8px 10px; tab-size: 3;
  background: var(--panel); color: var(--ink); border: 1.5px dashed var(--accent); border-radius: 5px;
}
.slot textarea:focus { border-style: solid; outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.tok-kw { color: var(--kw); font-weight: 500; }
.tok-ctor { color: var(--ctor); }
.tok-cmt { color: var(--cmt); font-style: italic; }
.tok-str { color: var(--str); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 14px; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn kbd { font-family: var(--font-mono); font-size: 11px; opacity: 0.8; margin-left: 6px; }
.actions .note { font-size: 12.5px; color: var(--muted); }

.hints { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.hint { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 8px 12px; border-radius: 0 6px 6px 0; font-size: 14px; }
.hint pre { margin: 6px 0 0; white-space: pre-wrap; }
.solution { margin-top: 14px; }
.solution pre { margin: 6px 0 0; padding: 12px 14px; background: var(--code); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; }
.solution .lbl { font-size: 12px; color: var(--muted); }

.summary { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.summary h2 { margin: 0; font-size: 16px; }
.bar { flex: 1; min-width: 120px; height: 8px; background: var(--code); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .p { background: var(--ok); }
.bar .f { background: var(--bad); }
.count { font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 14px; }
.tests { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.test { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.test.fail { border-color: var(--bad); }
.test .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.test .in { font-family: var(--font-mono); font-size: 13px; overflow-wrap: anywhere; min-width: 0; flex: 1; }
.test .tag { font-size: 11px; color: var(--muted); }
.kv { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 4px 10px; margin-top: 8px; font-size: 13px; }
.kv dt { color: var(--muted); font-size: 12px; padding-top: 1px; }
.kv dd { margin: 0; font-family: var(--font-mono); overflow-wrap: anywhere; min-width: 0; }
.diag { margin-top: 8px; font-size: 13.5px; }
.diag code { background: var(--code); padding: 0 4px; border-radius: 3px; overflow-wrap: anywhere; }
.test details { margin-top: 8px; font-size: 12.5px; }
.test details summary { cursor: pointer; color: var(--muted); }
.test details pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; padding: 8px 10px; background: var(--code); border-radius: 4px; }
.err { border-left: 3px solid var(--bad); background: var(--bad-soft); padding: 10px 12px; border-radius: 0 6px 6px 0; font-family: var(--font-mono); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }

details.types summary { cursor: pointer; font-weight: 600; }
details.types pre { overflow-x: auto; margin: 12px 0 0; padding: 12px 14px; background: var(--code); border-radius: 6px; line-height: 1.55; }
details.types p { font-size: 14px; color: var(--muted); margin: 10px 0 0; max-width: 70ch; }

.ac { position: fixed; z-index: 50; width: min(460px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 10px 28px rgba(8, 18, 38, 0.22); font-family: var(--font-mono); font-size: 12.5px; overflow: hidden; }
.ac ul { list-style: none; margin: 0; padding: 3px; max-height: 214px; overflow-y: auto; }
.ac li { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
.ac li.sel { background: var(--accent-soft); }
.ac .lb { flex: none; }
.ac .lb b { color: var(--accent); font-weight: 700; }
.ac .dt { margin-left: auto; padding-left: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; min-width: 0; font-size: 11.5px; }
.ki { width: 16px; height: 16px; border-radius: 3px; display: inline-grid; place-items: center; font-size: 10.5px; font-weight: 700; color: var(--panel); flex: none; }
.ki-ctor { background: var(--ctor); }
.ki-fn { background: var(--accent); }
.ki-var { background: var(--str); }
.ki-kw { background: var(--kw); }
.ac .doc { border-top: 1px solid var(--line); padding: 7px 10px; background: var(--code); font-size: 12px; overflow-wrap: anywhere; }
.ac .doc p { margin: 3px 0 0; color: var(--cmt); font-style: italic; }
.ac .keys { border-top: 1px solid var(--line); padding: 4px 10px; color: var(--muted); font-family: var(--font-body); font-size: 11.5px; }
@media (max-width: 820px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  nav { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  nav .label { display: none; }
  nav button { width: auto; flex: none; border-color: var(--line); background: var(--panel); }
  .card { padding: 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  .test { animation: in .18s ease-out both; }
  @keyframes in { from { transform: translateY(3px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<script id="engine">
// ---------- types (mirrors common.ml) ----------
const CTORS = {
  BoolConst:['const',['bool']], IntConst:['const',['int']], FloatConst:['const',['float']], StringConst:['const',['string']], NilConst:['const',[]], UnitConst:['const',[]],
  IntNegOp:['mon',[]], HdOp:['mon',[]], TlOp:['mon',[]], FstOp:['mon',[]], SndOp:['mon',[]],
  IntPlusOp:['bin',[]], IntMinusOp:['bin',[]], IntTimesOp:['bin',[]], IntDivOp:['bin',[]], FloatPlusOp:['bin',[]], FloatMinusOp:['bin',[]], FloatTimesOp:['bin',[]], FloatDivOp:['bin',[]], ConcatOp:['bin',[]], ConsOp:['bin',[]], CommaOp:['bin',[]], EqOp:['bin',[]], GreaterOp:['bin',[]],
  VarExp:['exp',['string']], ConstExp:['exp',['const']], MonOpAppExp:['exp',['mon','exp']], BinOpAppExp:['exp',['bin','exp','exp']], IfExp:['exp',['exp','exp','exp']], AppExp:['exp',['exp','exp']], FunExp:['exp',['string','exp']], LetInExp:['exp',['string','exp','exp']], LetRecInExp:['exp',['string','string','exp','exp']],
  Kvar:['contvar',[]],
  External:['cont',[]], ContVarCPS:['cont',['contvar']], FnContCPS:['cont',['string','expcps']],
  VarCPS:['expcps',['cont','string']], ConstCPS:['expcps',['cont','const']], MonOpAppCPS:['expcps',['cont','mon','string']], BinOpAppCPS:['expcps',['cont','bin','string','string']], IfCPS:['expcps',['string','expcps','expcps']], AppCPS:['expcps',['cont','string','string']], FunCPS:['expcps',['cont','string','contvar','expcps']], FixCPS:['expcps',['cont','string','string','contvar','expcps']],
};
const TYPE_NAMES = {const:'const', mon:'mon_op', bin:'bin_op', exp:'exp', cont:'cps_cont', expcps:'exp_cps', contvar:'cont_var', string:'string', int:'int', bool:'bool', float:'float', list:'list', tuple:'tuple', function:'function', unit:'unit'};
const MON = {IntNegOp:'~', HdOp:'hd', TlOp:'tl', FstOp:'fst', SndOp:'snd'};
const BIN = {IntPlusOp:'+', IntMinusOp:'-', IntTimesOp:'*', IntDivOp:'/', FloatPlusOp:'+.', FloatMinusOp:'-.', FloatTimesOp:'*.', FloatDivOp:'/.', ConcatOp:'^', ConsOp:'::', CommaOp:',', EqOp:'=', GreaterOp:'>'};
const UNIT = {unit:true};
const C = (c, ...args) => ({c, args});

class OErr extends Error { constructor(msg, pos) { super(msg); this.pos = pos; } }

function typeOf(v) {
  if (typeof v === 'string') return 'string';
  if (typeof v === 'boolean') return 'bool';
  if (typeof v === 'number') return Number.isInteger(v) ? 'int' : 'float';
  if (typeof v === 'function') return 'function';
  if (Array.isArray(v)) return 'list';
  if (v && v.c) return CTORS[v.c][0];
  if (v && v.tuple) return 'tuple';
  return 'unit';
}
const fits = (v, ty) => ty === 'float' ? typeof v === 'number' : typeOf(v) === ty;
const clip = (s, n = 70) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const describe = v => `a ${TYPE_NAMES[typeOf(v)]} (${clip(showVal(v))})`;

function showVal(v) {
  if (typeof v === 'string') return JSON.stringify(v);
  if (typeof v === 'number' || typeof v === 'boolean') return String(v);
  if (typeof v === 'function') return '<fun>';
  if (Array.isArray(v)) return '[' + v.map(showVal).join('; ') + ']';
  if (v.tuple) return '(' + v.items.map(showVal).join(', ') + ')';
  if (v.unit) return '()';
  if (!v.args.length) return v.c;
  if (v.args.length === 1) {
    const a = v.args[0], s = showVal(a);
    return v.c + ' ' + ((a && a.c && a.args.length) || (typeof a === 'number' && a < 0) ? '(' + s + ')' : s);
  }
  return v.c + ' (' + v.args.map(showVal).join(', ') + ')';
}

// ---------- printers (ports of common.ml) ----------
function sConst(c) {
  const a = c.args[0];
  switch (c.c) {
    case 'BoolConst': return a ? 'true' : 'false';
    case 'IntConst': return String(a);
    case 'FloatConst': return Number.isInteger(a) ? a + '.0' : String(a);
    case 'StringConst': return JSON.stringify(a);
    case 'NilConst': return '[]';
    case 'UnitConst': return '()';
  }
}
function sExp(e) {
  const [a, b, c] = e.args;
  switch (e.c) {
    case 'VarExp': return a;
    case 'ConstExp': return sConst(a);
    case 'IfExp': return 'if ' + sExp(a) + ' then ' + sExp(b) + ' else ' + sExp(c);
    case 'MonOpAppExp': return MON[a.c] + ' ' + pExp(b);
    case 'BinOpAppExp': return a.c === 'CommaOp' ? '(' + pExp(b) + BIN[a.c] + pExp(c) + ')' : pExp(b) + ' ' + BIN[a.c] + ' ' + pExp(c);
    case 'AppExp': return (a.c === 'AppExp' ? sExp(a) : pExp(a)) + ' ' + pExp(b);
    case 'FunExp': return 'fun ' + a + ' -> ' + sExp(b);
    case 'LetInExp': return 'let ' + a + ' = ' + sExp(b) + ' in ' + sExp(c);
    case 'LetRecInExp': return 'let rec ' + a + ' ' + b + ' = ' + sExp(c) + ' in ' + sExp(e.args[3]);
  }
}
const pExp = e => (e.c === 'VarExp' || e.c === 'ConstExp') ? sExp(e) : '(' + sExp(e) + ')';
function sCps(e) {
  const [a0, a1, a2, a3, a4] = e.args;
  switch (e.c) {
    case 'VarCPS': return pK(a0) + ' ' + a1;
    case 'ConstCPS': return pK(a0) + ' ' + sConst(a1);
    case 'MonOpAppCPS': return pK(a0) + '(' + MON[a1.c] + ' ' + a2 + ')';
    case 'BinOpAppCPS': return pK(a0) + '(' + a2 + ' ' + BIN[a1.c] + ' ' + a3 + ')';
    case 'IfCPS': return 'IF ' + a0 + ' THEN ' + sCps(a1) + ' ELSE ' + sCps(a2);
    case 'AppCPS': return '(' + a1 + ' ' + a2 + ' ' + pK(a0) + ')';
    case 'FunCPS': return pK(a0) + ' (' + funk(a1, a3) + ')';
    case 'FixCPS': return pK(a0) + '(FIX ' + a1 + '. ' + funk(a2, a4) + ')';
  }
}
const funk = (x, e) => 'FUN ' + x + ' _k -> ' + sCps(e);
function sK(k) {
  if (k.c === 'External') return '<external>';
  if (k.c === 'ContVarCPS') return '_k';
  return 'FN ' + k.args[0] + ' -> ' + sCps(k.args[1]);
}
const pK = k => k.c === 'FnContCPS' ? '(' + sK(k) + ')' : sK(k);

// ---------- helpers from common.ml / earlier problems ----------
function intToString(n) {
  const l = [];
  while (n > 0) { const c = (n - 1) % 26; l.unshift(c); n = (n - (c + 1)) / 26; }
  return l.map(c => String.fromCharCode(97 + c)).join('');
}
function freshFor(lst) { let n = 1; while (lst.includes(intToString(n))) n++; return intToString(n); }
function fvExp(e) {
  const [a, b, c, d] = e.args;
  switch (e.c) {
    case 'VarExp': return [a];
    case 'ConstExp': return [];
    case 'MonOpAppExp': return fvExp(b);
    case 'BinOpAppExp': return fvExp(b).concat(fvExp(c));
    case 'IfExp': return fvExp(a).concat(fvExp(b), fvExp(c));
    case 'AppExp': return fvExp(a).concat(fvExp(b));
    case 'FunExp': return fvExp(b).filter(y => y !== a);
    case 'LetInExp': return fvExp(b).concat(fvExp(c).filter(y => y !== a));
    case 'LetRecInExp': return fvExp(c).filter(y => y !== a && y !== b).concat(fvExp(d).filter(y => y !== a));
  }
}
function fvCps(e) {
  const [k, a, b, c, d] = e.args;
  switch (e.c) {
    case 'VarCPS': return [a].concat(fvK(k));
    case 'ConstCPS': return fvK(k);
    case 'MonOpAppCPS': return [b].concat(fvK(k));
    case 'BinOpAppCPS': return [b, c].concat(fvK(k));
    case 'IfCPS': return [k].concat(fvCps(a), fvCps(b));
    case 'AppCPS': return [a, b].concat(fvK(k));
    case 'FunCPS': return fvK(k).concat(fvCps(c).filter(y => y !== a));
    case 'FixCPS': return fvK(k).concat(fvCps(d).filter(y => y !== a && y !== b));
  }
}
// Matches common.ml exactly: FnContCPS (x, e) reports fv(e) without removing x.
function fvK(k) { return k.c === 'FnContCPS' ? fvCps(k.args[1]) : []; }

// ---------- exp_cps_normalize (port of common.ml) ----------

  const line = before.slice(before.lastIndexOf('\n') + 1);
  if ((line.split('"').length - 1) % 2 === 1 || before.lastIndexOf('(*') > before.lastIndexOf('*)')) return acClose();
  const m = /[A-Za-z_][A-Za-z0-9_'.]*$/.exec(before);
  const word = m ? m[0] : '';
  if (!word && !force) return acClose();
  const items = acItems(ta).map(it => ({it, m: word ? fuzzy(word, it.label) : {score:0, idx:[]}})).filter(x => x.m)
    .sort((a, b) => a.m.score - b.m.score || a.it.pri - b.it.pri || a.it.label.localeCompare(b.it.label));
  if (!items.length || (!force && items.length === 1 && items[0].it.label === word)) return acClose();
  ac = {ta, word, start: pos - word.length, items: items.slice(0, 50), sel: 0};
  acRender();
}
function acRender() {
  const {items, sel, ta} = ac;
  const mark = (s, idx) => [...s].map((ch, i) => idx.includes(i) ? `<b>${esc(ch)}</b>` : esc(ch)).join('');
  const cur = items[sel].it;
  acBox.innerHTML = `<ul role="listbox">${items.map((x, i) => `<li role="option" data-i="${i}" class="${i === sel ? 'sel' : ''}" aria-selected="${i === sel}"><span class="ki ki-${x.it.kind}">${KIND_LETTER[x.it.kind]}</span><span class="lb">${mark(x.it.label, x.m.idx)}</span><span class="dt">${esc(x.it.detail)}</span></li>`).join('')}</ul>
    <div class="doc"><code>${hl(cur.label + ' : ' + cur.detail)}</code>${cur.doc ? `<p>(* ${esc(cur.doc)} *)</p>` : ''}</div>
    <div class="keys">↑↓ to choose · Tab or Enter to insert · Esc to close</div>`;
  acBox.querySelectorAll('li').forEach(li => li.onclick = () => acAccept(+li.dataset.i));
  acBox.hidden = false;
  const selLi = acBox.querySelector('li.sel');
  if (selLi) selLi.scrollIntoView({block:'nearest'});
  const c = caretXY(ta, ac.start), r = ta.getBoundingClientRect();
  const x = r.left + c.x - ta.scrollLeft, y = r.top + c.y - ta.scrollTop;
  const w = acBox.offsetWidth, h = acBox.offsetHeight;
  acBox.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + 'px';
  acBox.style.top = (y + c.h + h + 8 > innerHeight && y - h - 4 > 0 ? y - h - 4 : y + c.h + 2) + 'px';
}
function caretXY(ta, pos) {
  const cs = getComputedStyle(ta), d = document.createElement('div');
  ['boxSizing', 'width', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft', 'borderTopWidth', 'borderRightWidth', 'borderBottomWidth', 'borderLeftWidth', 'borderStyle', 'fontFamily', 'fontSize', 'fontWeight', 'lineHeight', 'letterSpacing', 'tabSize']
    .forEach(p => { d.style[p] = cs[p]; });
  Object.assign(d.style, {position:'absolute', visibility:'hidden', whiteSpace:'pre-wrap', overflowWrap:'break-word', top:'0', left:'-9999px'});
  d.textContent = ta.value.slice(0, pos);
  const s = document.createElement('span'); s.textContent = '​'; d.appendChild(s);
  document.body.appendChild(d);
  const out = {x: s.offsetLeft, y: s.offsetTop, h: parseFloat(cs.lineHeight) || 20};
  d.remove();
  return out;
}
function acAccept(i) {
  const {ta, start, items} = ac, end = ta.selectionStart;
  acClose();
  ta.setRangeText(items[i].it.label, start, end, 'end');
  acSuppress = true; ta.dispatchEvent(new Event('input')); acSuppress = false;
  ta.focus();
}
function acClose() { ac = null; acBox.hidden = true; }
function attachAC(ta) {
  ta.addEventListener('input', () => { if (!acSuppress) acUpdate(ta); });
  ta.addEventListener('keydown', e => {
    if (e.ctrlKey && (e.key === ' ' || e.code === 'Space')) { e.preventDefault(); acUpdate(ta, true); return; }
    if (!ac || ac.ta !== ta) return;
    const n = ac.items.length;
    if (e.key === 'ArrowDown') { e.preventDefault(); ac.sel = (ac.sel + 1) % n; acRender(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); ac.sel = (ac.sel - 1 + n) % n; acRender(); }
    else if (e.key === 'Escape') { e.preventDefault(); acClose(); }
    else if (e.key === 'Tab' || (e.key === 'Enter' && !e.metaKey && !e.ctrlKey && !e.shiftKey)) {
      // Enter on an already-complete word (e.g. "in") should still make a newline.
      if (e.key === 'Enter' && ac.items[ac.sel].it.label === ac.word) { acClose(); return; }
      e.preventDefault(); acAccept(ac.sel);
    }
    else if (['ArrowLeft', 'ArrowRight', 'Home', 'End', 'PageUp', 'PageDown'].includes(e.key)) acClose();
  });
  ta.addEventListener('blur', acClose);
  ta.addEventListener('mousedown', acClose);
  ta.addEventListener('scroll', acClose);
}
addEventListener('scroll', acClose, true);
addEventListener('resize', acClose);

// ---------- running ----------
function run() {
  const all = state.cur === 'ALL';
  const keys = all ? ORDER : [state.cur];
  const asts = {...REF_ASTS};
  for (const k of keys) {
    const src = (all ? state.all[k] : state.drafts[k]) || '';
    try { asts[k] = compileArm(k, src, 'user:' + k); }
    catch (err) {
      if (!(err instanceof OErr)) throw err;
      lastResults = {compile: locate(err.pos) + err.message, key: k};
      state.solved[state.cur] = false; save(); render(); return;
    }
  }
  const userCps = makeCps(asts);
  const cases = [];
  if (all) {
    ORDER.forEach(k => TESTS[k].forEach(([e, kk]) => cases.push({e:evalValue(e), k:evalValue(kk), tag:k})));
    for (let i = 0; i < 12; i++) cases.push({e:genExp(3), k:pick(KPOOL), tag:'random'});
  } else {
    TESTS[state.cur].forEach(([e, kk]) => cases.push({e:evalValue(e), k:evalValue(kk), tag:'fixed'}));
    for (let i = 0; i < 6; i++) cases.push({e:genExp(2, state.cur), k:pick(KPOOL), tag:'random'});
  }
  const results = cases.map(c => ({...c, ...grade(userCps, c.e, c.k)}));
  const ok = results.every(r => r.status === 'pass');
  state.solved[state.cur] = ok;
  if (all && ok) ORDER.forEach(k => { if (state.solved[k] !== true) state.solved[k] = true; });
  save();
  lastResults = {results};
  render();
  document.getElementById('results').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start'});
}

function renderResults() {
  const box = document.getElementById('results');
  if (!lastResults) {
    box.innerHTML = `<div class="summary"><h2>Tests</h2></div><p class="empty" style="margin-top:8px">Write the arm above and run the tests. Each run checks hand-picked cases, including ones built to catch variable capture, plus fresh random expressions.</p>`;
    return;
  }
  if (lastResults.compile) {
    box.innerHTML = `<div class="summary"><h2>Doesn't compile</h2><span class="pill bad">Error</span></div><div class="err" style="margin-top:12px">${esc(lastResults.compile)}</div>`;
    return;
  }
  const rs = lastResults.results, p = rs.filter(r => r.status === 'pass').length, n = rs.length;
  const sorted = rs.slice().sort((a, b) => (a.status === 'pass') - (b.status === 'pass'));
  box.innerHTML = `<div class="summary"><h2>Tests</h2><span class="count">${p} / ${n} passed</span>
      <div class="bar"><i class="p" style="width:${100 * p / n}%"></i><i class="f" style="width:${100 * (n - p) / n}%"></i></div>
      ${p === n ? '<span class="pill ok">All passing</span>' : '<span class="pill bad">' + (n - p) + ' failing</span>'}</div>
    <div class="tests">${sorted.map(testCard).join('')}</div>`;
}
function testCard(r) {
  const pill = r.status === 'pass' ? '<span class="pill ok">Pass</span>' : r.status === 'error' ? '<span class="pill bad">Error</span>' : '<span class="pill bad">Fail</span>';
  let body = '';
  const raw = `<details><summary>Raw OCaml values</summary><pre>e = ${esc(showVal(r.e))}\nk = ${esc(showVal(r.k))}\n\nexpected = ${esc(showVal(r.expected))}${r.got ? '\n\nyours    = ' + esc(showVal(r.got)) : ''}</pre></details>`;
  if (r.status === 'pass') {
    body = `<details><summary>${r.exact ? 'Output (identical to the reference)' : 'Output (same after renaming FN-bound variables; the grader accepts this)'}</summary><pre>${esc(sCps(r.got))}</pre></details>`;
  } else if (r.status === 'error') {
    body = `<div class="err" style="margin-top:8px">${esc(locate(r.err.pos) + r.err.message)}</div>
      <dl class="kv"><dt>expected</dt><dd>${esc(sCps(r.expected))}</dd></dl>${raw}`;
  } else {
    let diag = '';
    if (r.capture) diag = 'The shape is right, but variables are wired wrong. A fresh name probably captures a free variable: check the list you pass to <code>freshFor</code>.';
    if (r.diff) {
      const where = r.diff.path.length ? ` inside <code>${r.diff.path.join(' → ')}</code>` : ' at the top';
      const show = v => typeof v === 'string' ? JSON.stringify(v) : v && v.c ? clip(showVal(v), 90) : String(v);
      diag += `${diag ? ' ' : ''}First difference${where}: expected <code>${esc(show(r.diff.r))}</code>, yours has <code>${esc(show(r.diff.u))}</code>${r.capture ? ' (after normalizing names)' : ''}.`;
    }
    body = `<dl class="kv"><dt>expected</dt><dd>${esc(sCps(r.expected))}</dd><dt>yours</dt><dd>${esc(sCps(r.got))}</dd></dl><div class="diag">${diag}</div>${raw}`;
  }
  return `<div class="test ${r.status === 'pass' ? '' : 'fail'}">
    <div class="row">${pill}<span class="in">[[${esc(sExp(r.e))}]]  with  k = ${esc(sK(r.k))}</span><span class="tag">${r.tag}</span></div>${body}</div>`;
}

const hardBox = document.getElementById('hard');
hardBox.checked = !!state.hard;
hardBox.onchange = () => { state.hard = hardBox.checked; save(); render(); };
if (!(state.cur in ARMS) && state.cur !== 'ALL') state.cur = 'FunExp';
render();
</script>
